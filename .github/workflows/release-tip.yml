name: Release Tip

on:
  workflow_run:
    workflows:
      - Test
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      revision:
        description: Commit to build; defaults to the dispatched revision
        required: false
        type: string

permissions:
  contents: write

# Releases must finish atomically. New main revisions queue behind an active release.
concurrency:
  group: tip-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      REVISION: ${{ inputs.revision || github.event.workflow_run.head_sha || github.sha }}
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache/global
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache/local

    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.REVISION }}

      - name: Restore Zig cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        env:
          DEPS_HASH: ${{ hashFiles('flake.lock', 'build.zig.zon', 'build.zig.zon.nix') }}
        with:
          path: |
            .zig-cache/global
            .zig-cache/local
            .zig-cache/ghostty
          key: bobrvm-release-macos-${{ env.DEPS_HASH }}-${{ env.REVISION }}
          restore-keys: |
            bobrvm-release-macos-${{ env.DEPS_HASH }}-
            bobrvm-release-macos-

      - name: Restore Xcode compilation cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        env:
          XCODE_HASH: ${{ hashFiles('macos/Bobrvm.xcodeproj/project.pbxproj') }}
        with:
          path: ${{ runner.temp }}/bobrvm-xcode-cache
          key: bobrvm-xcode-release-${{ env.XCODE_HASH }}-${{ env.REVISION }}
          restore-keys: |
            bobrvm-xcode-release-${{ env.XCODE_HASH }}-
            bobrvm-xcode-release-

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41
        with:
          determinate: true

      - name: Restore and save Nix artifacts
        uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98
        with:
          use-flakehub: false

      - name: Prepare Zig package directories
        id: zig-deps
        run: |
          system=$(nix build --no-link --print-out-paths .#deps)
          direct=$(nix build --no-link --print-out-paths .#framework-deps)
          echo "system=$system" >> "$GITHUB_OUTPUT"
          mkdir -p "$ZIG_GLOBAL_CACHE_DIR" "$ZIG_LOCAL_CACHE_DIR"
          if [[ -L "$ZIG_GLOBAL_CACHE_DIR/p" ]]; then
            unlink "$ZIG_GLOBAL_CACHE_DIR/p"
          elif [[ -e "$ZIG_GLOBAL_CACHE_DIR/p" ]]; then
            echo "$ZIG_GLOBAL_CACHE_DIR/p is not a symbolic link" >&2
            exit 1
          fi
          ln -s "$direct" "$ZIG_GLOBAL_CACHE_DIR/p"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build release frameworks
        env:
          BOBRVM_ZIG_SYSTEM_PACKAGE_DIR: ${{ steps.zig-deps.outputs.system }}
        run: |
          nix develop -c zig build \
            xcframework \
            ghostty-lib \
            -Demit-macos-app=false \
            -Doptimize=ReleaseFast

      # Nix provides Zig and its dependencies. Xcode must run in the native environment.
      - name: Build SwiftUI app
        run: |
          xcodebuild \
            -project macos/Bobrvm.xcodeproj \
            -scheme Bobrvm \
            -configuration Release \
            "SYMROOT=$PWD/macos/build" \
            "CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            ONLY_ACTIVE_ARCH=YES \
            "COMPILATION_CACHE_CAS_PATH=$RUNNER_TEMP/bobrvm-xcode-cache" \
            COMPILATION_CACHE_KEEP_CAS_DIRECTORY=YES \
            build

      - name: Select signing mode
        id: signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.PROD_MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_NAME }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.PROD_MACOS_CERTIFICATE_PWD }}
          MACOS_CI_KEYCHAIN_PWD: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}
          APPLE_NOTARIZATION_ISSUER: ${{ secrets.APPLE_NOTARIZATION_ISSUER }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE" ]]; then
            if [[ -n "$MACOS_CERTIFICATE_NAME$MACOS_CERTIFICATE_PWD$MACOS_CI_KEYCHAIN_PWD" ]]; then
              echo "Developer ID certificate secrets are only partially configured" >&2
              exit 1
            fi
            echo "developer-id=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Publishing an ad-hoc signed build; Developer ID certificate is absent"
            exit 0
          fi

          : "${MACOS_CERTIFICATE_NAME:?PROD_MACOS_CERTIFICATE_NAME is not configured}"
          : "${MACOS_CERTIFICATE_PWD:?PROD_MACOS_CERTIFICATE_PWD is not configured}"
          : "${MACOS_CI_KEYCHAIN_PWD:?PROD_MACOS_CI_KEYCHAIN_PWD is not configured}"
          : "${APPLE_NOTARIZATION_ISSUER:?APPLE_NOTARIZATION_ISSUER is not configured}"
          : "${APPLE_NOTARIZATION_KEY:?APPLE_NOTARIZATION_KEY is not configured}"
          : "${APPLE_NOTARIZATION_KEY_ID:?APPLE_NOTARIZATION_KEY_ID is not configured}"
          echo "developer-id=true" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        if: steps.signing.outputs.developer-id == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.PROD_MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_NAME }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.PROD_MACOS_CERTIFICATE_PWD }}
          MACOS_CI_KEYCHAIN_PWD: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}
        run: |
          certificate_path="$RUNNER_TEMP/bobrvm-certificate.p12"
          keychain_path="$RUNNER_TEMP/bobrvm-signing.keychain-db"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$MACOS_CI_KEYCHAIN_PWD" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security unlock-keychain -p "$MACOS_CI_KEYCHAIN_PWD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$MACOS_CERTIFICATE_PWD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$MACOS_CI_KEYCHAIN_PWD" \
            "$keychain_path"
          echo "BOBRVM_CERTIFICATE_PATH=$certificate_path" >> "$GITHUB_ENV"
          echo "BOBRVM_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

      - name: Sign app
        if: steps.signing.outputs.developer-id == 'true'
        env:
          MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_NAME }}
        run: |
          app="macos/build/Release/Bobrvm.app"
          test -d "$app"
          codesign \
            --force \
            --options runtime \
            --timestamp \
            --sign "$MACOS_CERTIFICATE_NAME" \
            --entitlements macos/Bobrvm.entitlements \
            "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Ad-hoc sign app
        if: steps.signing.outputs.developer-id != 'true'
        run: |
          app="macos/build/Release/Bobrvm.app"
          test -d "$app"
          codesign \
            --force \
            --deep \
            --options runtime \
            --sign - \
            --entitlements macos/Bobrvm.entitlements \
            "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Create disk image
        run: |
          app="macos/build/Release/Bobrvm.app"
          staging="$RUNNER_TEMP/bobrvm-dmg"
          mkdir -p "$staging"
          ditto "$app" "$staging/Bobrvm.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create \
            -volname Bobrvm \
            -srcfolder "$staging" \
            -ov \
            -format UDZO \
            Bobrvm-tip-arm64.dmg

      - name: Sign disk image
        if: steps.signing.outputs.developer-id == 'true'
        env:
          MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_NAME }}
        run: |
          codesign \
            --force \
            --timestamp \
            --sign "$MACOS_CERTIFICATE_NAME" \
            Bobrvm-tip-arm64.dmg

      - name: Notarize and staple
        if: steps.signing.outputs.developer-id == 'true'
        env:
          APPLE_NOTARIZATION_ISSUER: ${{ secrets.APPLE_NOTARIZATION_ISSUER }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
        run: |
          key_path="$RUNNER_TEMP/bobrvm-notarization-key.p8"
          printf '%s' "$APPLE_NOTARIZATION_KEY" > "$key_path"
          xcrun notarytool submit Bobrvm-tip-arm64.dmg \
            --key "$key_path" \
            --key-id "$APPLE_NOTARIZATION_KEY_ID" \
            --issuer "$APPLE_NOTARIZATION_ISSUER" \
            --wait
          rm -f "$key_path"
          xcrun stapler staple Bobrvm-tip-arm64.dmg
          xcrun stapler staple macos/build/Release/Bobrvm.app
          xcrun stapler validate Bobrvm-tip-arm64.dmg

      - name: Package app and symbols
        run: |
          app="macos/build/Release/Bobrvm.app"
          dsym="macos/build/Release/Bobrvm.app.dSYM"
          test -d "$dsym"
          ditto -c -k --sequesterRsrc --keepParent "$app" Bobrvm-tip-arm64.zip
          ditto -c -k --keepParent "$dsym" Bobrvm-tip-arm64-dSYM.zip
          shasum -a 256 \
            Bobrvm-tip-arm64.dmg \
            Bobrvm-tip-arm64.zip \
            Bobrvm-tip-arm64-dSYM.zip \
            > SHA256SUMS

      - name: Publish tip release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          fail_on_unmatched_files: true
          files: |
            Bobrvm-tip-arm64.dmg
            Bobrvm-tip-arm64.zip
            Bobrvm-tip-arm64-dSYM.zip
            SHA256SUMS
          name: Bobrvm Tip
          prerelease: true
          tag_name: tip
          target_commitish: ${{ env.REVISION }}

      - name: Advance tip tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa tip -m "Latest continuous release" "$REVISION"
          git push --force origin refs/tags/tip

      - name: Remove signing material
        if: always()
        run: |
          if [[ -n "${BOBRVM_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$BOBRVM_KEYCHAIN_PATH" || true
          fi
          rm -f \
            "${BOBRVM_CERTIFICATE_PATH:-$RUNNER_TEMP/bobrvm-certificate.p12}" \
            "$RUNNER_TEMP/bobrvm-notarization-key.p8"
