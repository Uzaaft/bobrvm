name: Tip release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tip-release
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache/global
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache/local

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true

      - name: Build Zig library with Nix
        run: nix build --print-build-logs

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Prepare Zig caches
        run: mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp" "$ZIG_LOCAL_CACHE_DIR/tmp"

      - name: Build Ghostty framework
        run: zig build ghostty-lib -Doptimize=ReleaseFast

      - name: Create Bobrvm framework
        run: |
          tools/repack-static-library.sh \
              "$PWD/result/lib/libbobrvm.a" \
              "$PWD/zig-out/lib/libbobrvm-xcode.a"
          rm -rf macos/BobrvmKit.xcframework
          xcodebuild -create-xcframework \
              -library zig-out/lib/libbobrvm-xcode.a \
              -headers result/include \
              -output macos/BobrvmKit.xcframework

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build SwiftUI app
        run: |
          xcodebuild \
              -project macos/Bobrvm.xcodeproj \
              -scheme Bobrvm \
              -configuration Release \
              -derivedDataPath zig-out/xcode-derived-data \
              CODE_SIGNING_ALLOWED=YES \
              ONLY_ACTIVE_ARCH=YES \
              -quiet \
              build

      - name: Package app
        run: |
          app="zig-out/xcode-derived-data/Build/Products/Release/Bobrvm.app"
          test -d "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" Bobrvm-tip-arm64.zip

      - name: Publish tip release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view tip >/dev/null 2>&1; then
              gh api \
                  --method PATCH \
                  "repos/$GITHUB_REPOSITORY/git/refs/tags/tip" \
                  -f sha="$GITHUB_SHA" \
                  -F force=true
              gh release edit tip \
                  --title "Tip" \
                  --notes "Automated Apple Silicon build of commit \`$GITHUB_SHA\`." \
                  --prerelease
              gh release upload tip Bobrvm-tip-arm64.zip --clobber
          else
              gh release create tip \
                  Bobrvm-tip-arm64.zip \
                  --target "$GITHUB_SHA" \
                  --title "Tip" \
                  --notes "Automated Apple Silicon build of commit \`$GITHUB_SHA\`." \
                  --prerelease
          fi
