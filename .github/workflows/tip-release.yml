name: Tip release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tip-release
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache/global
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache/local

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true

      - name: Build Zig library with Nix
        run: nix build --print-build-logs

      - name: Build Zig dependency directory
        id: deps
        run: |
          nix build --print-build-logs .#deps
          echo "path=$(readlink result)" >> "$GITHUB_OUTPUT"

      - name: Build direct Zig dependency cache
        id: direct-deps
        run: |
          nix build --print-build-logs .#framework-deps
          echo "path=$(readlink result)" >> "$GITHUB_OUTPUT"

      - name: Prepare Zig caches
        env:
          BOBRVM_ZIG_DIRECT_DEPS: ${{ steps.direct-deps.outputs.path }}
        run: |
          mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp" "$ZIG_LOCAL_CACHE_DIR/tmp"
          ln -s "$BOBRVM_ZIG_DIRECT_DEPS" "$ZIG_GLOBAL_CACHE_DIR/p"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app frameworks
        env:
          BOBRVM_ZIG_SYSTEM_PACKAGE_DIR: ${{ steps.deps.outputs.path }}
        run: |
          nix develop --command zig build \
              -Doptimize=ReleaseFast \
              -Demit-xcframework=true \
              -Demit-macos-app=false

      - name: Build SwiftUI app
        run: |
          xcodebuild \
              -project macos/Bobrvm.xcodeproj \
              -scheme Bobrvm \
              -configuration Release \
              -derivedDataPath zig-out/xcode-derived-data \
              CODE_SIGNING_ALLOWED=YES \
              ONLY_ACTIVE_ARCH=YES \
              -quiet \
              build

      - name: Package app
        run: |
          app="zig-out/xcode-derived-data/Build/Products/Release/Bobrvm.app"
          test -d "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" Bobrvm-tip-arm64.zip

      - name: Publish tip release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          name: Tip
          prerelease: true
          tag_name: tip
          target_commitish: ${{ github.sha }}
          files: Bobrvm-tip-arm64.zip
