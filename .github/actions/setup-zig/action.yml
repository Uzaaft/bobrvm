name: Set up Zig with Nix
description: Restore Zig and Nix artifacts and prepare Bobrvm's package directories.

inputs:
  cache-scope:
    description: Cache namespace for the consuming job.
    required: true
  revision:
    description: Source revision used to create an exact cache key.
    required: true

outputs:
  system-deps:
    description: Full system package directory used by the nested Ghostty build.
    value: ${{ steps.deps.outputs.system }}

runs:
  using: composite
  steps:
    - name: Configure Zig cache paths
      shell: bash
      run: |
        echo "ZIG_GLOBAL_CACHE_DIR=$GITHUB_WORKSPACE/.zig-cache/global" >> "$GITHUB_ENV"
        echo "ZIG_LOCAL_CACHE_DIR=$GITHUB_WORKSPACE/.zig-cache/local" >> "$GITHUB_ENV"

    - name: Build cache keys
      id: cache-key
      shell: bash
      env:
        CACHE_SCOPE: ${{ inputs.cache-scope }}
        DEPS_HASH: ${{ hashFiles('flake.lock', 'build.zig.zon', 'build.zig.zon.nix') }}
        REVISION: ${{ inputs.revision }}
        RUNNER_ARCH: ${{ runner.arch }}
        RUNNER_OS: ${{ runner.os }}
      run: |
        prefix="bobrvm-$CACHE_SCOPE-$RUNNER_OS-$RUNNER_ARCH"
        echo "exact=$prefix-$DEPS_HASH-$REVISION" >> "$GITHUB_OUTPUT"
        echo "deps=$prefix-$DEPS_HASH-" >> "$GITHUB_OUTPUT"
        echo "platform=$prefix-" >> "$GITHUB_OUTPUT"

    - name: Restore Zig cache
      uses: actions/cache@v4
      with:
        path: |
          .zig-cache/global
          .zig-cache/local
          .zig-cache/ghostty
        key: ${{ steps.cache-key.outputs.exact }}
        restore-keys: |
          ${{ steps.cache-key.outputs.deps }}
          ${{ steps.cache-key.outputs.platform }}

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        determinate: true

    - name: Restore and save Nix artifacts
      uses: DeterminateSystems/magic-nix-cache-action@main
      with:
        use-flakehub: false

    - name: Build Zig dependency directories
      id: deps
      shell: bash
      run: |
        system=$(nix build --no-link --print-out-paths .#deps)
        direct=$(nix build --no-link --print-out-paths .#framework-deps)
        echo "system=$system" >> "$GITHUB_OUTPUT"
        echo "direct=$direct" >> "$GITHUB_OUTPUT"

    # Bobrvm resolves its direct packages through Zig's package cache. The
    # generated system directory is reserved for Ghostty's transitive graph.
    - name: Prepare Zig package cache
      shell: bash
      env:
        DIRECT_DEPS: ${{ steps.deps.outputs.direct }}
      run: |
        mkdir -p "$ZIG_GLOBAL_CACHE_DIR" "$ZIG_LOCAL_CACHE_DIR"
        if [[ -L "$ZIG_GLOBAL_CACHE_DIR/p" ]]; then
          unlink "$ZIG_GLOBAL_CACHE_DIR/p"
        elif [[ -e "$ZIG_GLOBAL_CACHE_DIR/p" ]]; then
          echo "$ZIG_GLOBAL_CACHE_DIR/p is not a symbolic link" >&2
          exit 1
        fi
        ln -s "$DIRECT_DEPS" "$ZIG_GLOBAL_CACHE_DIR/p"
